<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% if carro %}Editar carro{% else %}Nuevo carro{% endif %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        .contenedor {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            color: #111827;
        }

        form p {
            margin-bottom: 20px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .cancelar {
            margin-left: 10px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>CONCESIONARIO +</h1>

    <a href="{% url 'carros:index' %}"
       style="color:white; text-decoration:none;">
        Inicio
    </a>
</header>

<div class="contenedor">

    {% if carro %}
        <h2>✏️ Editar carro</h2>
    {% else %}
        <h2>🚗 Registrar nuevo carro</h2>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            {% if carro %}
                Guardar cambios
            {% else %}
                Registrar carro
            {% endif %}
        </button>

        <a class="cancelar"
           href="{% url 'carros:index' %}">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>

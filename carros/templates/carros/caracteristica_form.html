<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar característica</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 50px;
        }

        header h1 {
            margin: 0;
        }

        .contenedor {
            max-width: 600px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            color: #111827;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .cancelar {
            margin-left: 15px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>CONCESIONARIO +</h1>
</header>

<div class="contenedor">

    <h2>✏️ Editar característica</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Guardar característica
        </button>

        <a
            class="cancelar"
            href="{% url 'carros:detail' caracteristica.carro.id %}"
        >
            Cancelar
        </a>

    </form>

</div>

</body>
</html>

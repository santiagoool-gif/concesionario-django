<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agregar característica</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #172033;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        .car {
            color: #2f6df6;
            font-weight: bold;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        button,
        a {
            display: inline-block;
            padding: 13px 20px;
            border-radius: 8px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button {
            background: #2f6df6;
            color: white;
        }

        a {
            background: #eef2f6;
            color: #344054;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Agregar característica</h1>

            <p class="car">
                {{ carro.carro_text }}
            </p>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">
                    Guardar característica
                </button>

                <a href="{% url 'carros:detail' carro.id %}">
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</body>

</html>
